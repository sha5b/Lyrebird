<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<!--
			**The icon set, declared here rather than only in the layout.** `+layout.svelte` imports
			`$lib/assets/favicon.svg` through Vite, which gets it a hashed filename and covers the
			SVG case. It cannot cover the rest: a browser with no SVG-favicon support wants the .ico,
			iOS wants a 180 px PNG at a link it can find before any JavaScript runs, and both have to
			be at stable paths under `static/`. So both declarations exist and neither is redundant.

			Order matters: browsers take the last icon they understand, so the SVG is listed first
			and `alternate icon` carries the fallback.
		-->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
