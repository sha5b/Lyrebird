[project]
name = "birdy-pipeline"
version = "0.1.0"
description = "Offline Birdy pipeline: syrinx calibration, synthetic corpus, 28-d features, UMAP galaxy."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    # numba is a hard transitive dependency of umap-learn; it is pinned here only so
    # the resolver cannot pick a prehistoric llvmlite that fails to build on 3.11/3.12.
    # The syrinx ODE kernels use it when available (pure-Python fallback otherwise).
    "numba>=0.59",
    "umap-learn>=0.5.6",
    "scikit-learn>=1.4",
    "soundfile>=0.12",
]

[project.scripts]
birdy-pipeline = "birdy_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdy_pipeline"]
