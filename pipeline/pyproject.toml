[project]
name = "birdy-pipeline"
version = "0.1.0"
description = "Offline Lyrebird pipeline: syrinx calibration, synthetic corpus, 28-d features, UMAP galaxy."
readme = "README.md"
# Non-commercial. The distribution name stays `birdy-pipeline` (an identifier, not the
# product name); the licence covers this project's own code and prose only. The harvested
# recordings carry their own per-recording Creative Commons licences and are not ours to
# relicense — see the repository's NOTICE.md §3.
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    # numba is a hard transitive dependency of umap-learn; it is pinned here only so
    # the resolver cannot pick a prehistoric llvmlite that fails to build on 3.11/3.12.
    # The syrinx ODE kernels use it when available (pure-Python fallback otherwise).
    "numba>=0.59",
    "umap-learn>=0.5.6",
    "scikit-learn>=1.4",
    "soundfile>=0.12",
    "pacmap>=0.9.1",
]

[project.optional-dependencies]
# The learned critic of docs/09. Deliberately optional: `critic.py` is the only module
# that imports torch, it imports it lazily, and every caller degrades to the hand-written
# 28-d cosine when it is absent. Harvesting, fitting, building and serving must all keep
# working in an environment that has never seen torch — no weights ever reach the browser,
# so a machine that only builds the app has no reason to download 200 MB of wheels.
critic = ["torch>=2.2"]

# The multi-source fetchers of `sources.py`. Same pattern as the critic: `sources.py`
# is the only module that touches these packages, it imports them lazily inside the
# adapters, and `sources list`/`sources fetch` degrade to a logged
# `skip <source>: <reason>` when they are absent — Zenodo and the Internet Archive
# need nothing but urllib, so a machine harvesting only keyless sources has no reason
# to install either.
sources = ["kaggle>=1.6", "huggingface_hub>=0.24"]

# Perch 2.0 pseudo-labelling of docs/13 §A1 (`critic label-novel`). Same pattern as
# the critic: `perch.py` is the only module that imports onnxruntime, the hub packages
# are lazy imports used once to fetch the weights, and every caller degrades to a
# logged hint when they are absent. Inference is the ONNX port of the model — full
# TensorFlow (~600 MB) is deliberately not a dependency of anything in this repo.
perch = ["onnxruntime>=1.17", "kagglehub>=1.0", "huggingface_hub>=0.24"]

# The batch-effect correction of docs/23 W1. Same pattern again: `batcheffect.py` is the
# only module that imports harmonypy, it imports it lazily, and the module's own
# mean-centring baselines run with numpy alone — so the comparison still has two of its
# three arms on a machine without it. The problem it addresses is the recorder confound
# (docs/14 §14.4, docs/17 §§17.3, 17.5), which genomics calls a batch effect and has
# spent fifteen years on; Harmony corrects an existing embedding post-hoc and needs no
# retraining, which is what makes it testable here at all.
# harmonypy needs pandas at import time and does not declare it, so it is named here.
analysis = ["harmonypy>=0.0.9", "pandas>=2.0"]

# `docs/whitepaper/build_whitepaper.py`, which draws its own figures and writes the
# DOCX. These were installed by hand and undeclared until 2026-08-01, so the first
# `uv sync` that did not name them removed them and the builder stopped importing.
# Declaring them is the fix: a tool in this repo is a dependency of this repo.
whitepaper = ["python-docx>=1.1", "matplotlib>=3.8", "pillow>=10.0"]

[project.scripts]
birdy-pipeline = "birdy_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdy_pipeline"]

# CUDA 12.8 wheels: the development machine is an RTX 3500 Ada (compute 8.9, 12 GB).
# `critic.py` picks the device at runtime and falls back to CPU when no GPU is visible, so
# this only decides which wheel gets downloaded, never whether the code runs. Swap the index
# for `.../whl/cpu` on a machine with no NVIDIA card to save ~2 GB of download.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
